app = "finance-assistant-api"
primary_region = "iad"

[build]

[env]
  PORT = "8000"
  PYTHONPATH = "/app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false  # <- Disable Auto-Stop to Keep Alive
  auto_start_machines = true
  min_machines_running = 1    # <- Ensure at least 1 Machine stays running
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"  # <- Ensure this route exists and returns 200 OK

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "finance_assistant_data"
  destination = "/app/database"

[processes]
  app = "gunicorn app.main:app --bind 0.0.0.0:8000 --workers 1 --worker-class uvicorn.workers.UvicornWorker"
