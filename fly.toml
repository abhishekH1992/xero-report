app = "finance-assistant-api"
primary_region = "syd"

[build]

[env]
  PORT = "8000"
  PYTHONPATH = "/app"
  # DATABASE_URL will be injected via `fly postgres attach` or `fly secrets`

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  concurrency = { type = "connections", hard_limit = 25, soft_limit = 20 }

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
  restart = { policy = "on-failure", max_retries = 3 }

[processes]
  app = "gunicorn app.main:app --bind 0.0.0.0:8000 --workers 1 --worker-class uvicorn.workers.UvicornWorker"
