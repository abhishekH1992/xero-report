# fly.toml app configuration file generated for finance-assistant-api on 2025-08-08T13:33:07+12:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'finance-assistant-api'
primary_region = 'syd'

[build]

[env]
  PORT = '8000'
  PYTHONPATH = '/app'

[processes]
  app = 'bash -c "python -m app.workers.report_worker & gunicorn app.main:app --bind 0.0.0.0:8000 --workers 1 --worker-class uvicorn.workers.UvicornWorker --timeout 3600"'

[[mounts]]
  source = 'shared_reports_volume'
  destination = '/app/storage/reports'
  processes = ['app']

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app']
